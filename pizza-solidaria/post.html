<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pizza Solidária Post</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Gloock&family=Open+Sans:wght@400;600;700&display=block" rel="stylesheet">
<style>
:root{--black:#0E0204;--wine:#A30E2B;--pink:#DFBBCA;--twilight:#774972;--old:#7C5D72}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#222}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--black);color:var(--pink);font-family:'Open Sans',Arial,sans-serif}
.abs{position:absolute}
.glow{inset:0;background:radial-gradient(48% 40% at 66% 58%,rgba(163,14,43,.38),rgba(163,14,43,0) 70%),radial-gradient(40% 30% at 10% 95%,rgba(119,73,114,.25),transparent 70%)}
.label{font-size:17px;font-weight:700;letter-spacing:4px;text-transform:uppercase}

.head{left:56px;right:56px;top:52px;display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1.5px solid rgba(223,187,202,.35);z-index:5}
.head .l{display:flex;align-items:center;gap:12px}
.head img{width:30px}
.head .r{color:#a88a9d}

.h1{left:52px;top:118px;font-family:'Gloock';font-size:188px;line-height:.9;letter-spacing:-5px;z-index:5}
.h1 span{display:block}
.h1 .sub{font-size:76px;letter-spacing:-1px;margin-top:14px}
.h1 .sub i{font-style:normal;color:var(--wine)}
.kick{left:56px;top:470px;max-width:290px;font-size:21px;line-height:1.45;color:#c9a6b6;z-index:5}
.kick b{color:var(--pink);font-weight:700}

.wheel{left:392px;top:318px;width:860px;height:860px;z-index:3}
.wheel svg{width:100%;height:100%;overflow:visible}

.price{left:52px;top:742px;z-index:6}
.price .lbl{margin-bottom:14px;color:#c9a6b6}
.price .row{display:flex;align-items:flex-start;font-family:'Anton';line-height:.82}
.price .cur{font-family:'Gloock';font-size:44px;margin-top:16px;margin-right:6px}
.price .num{font-size:236px;letter-spacing:-5px}
.price .cents{font-size:54px;margin-top:14px;margin-left:4px}
.price .unit{font-family:'Gloock';font-size:30px;color:#c9a6b6;margin-top:12px}

.chip{right:56px;top:140px;z-index:6;display:flex;align-items:center;gap:14px;background:var(--pink);color:var(--black);padding:12px 22px 12px 14px;border-radius:999px}
.chip img{width:34px}
.chip span{font-family:'Gloock';font-size:26px;letter-spacing:-.3px}

.foot{left:56px;right:56px;bottom:36px;display:flex;justify-content:space-between;align-items:flex-end;z-index:6}
.foot .logo{height:58px}
.foot .c{text-align:right;line-height:1.5}
.foot .c .label{font-size:15px;color:#a88a9d}
.foot .c .t{font-family:'Anton';font-size:36px;letter-spacing:1px}
.rule{left:56px;right:56px;bottom:116px;height:1.5px;background:rgba(223,187,202,.35);z-index:6}
.grain{inset:0;opacity:.13;mix-blend-mode:screen;pointer-events:none;z-index:40}
</style>
</head>
<body>
<div class="post" id="post">
  <div class="abs glow"></div>

  <div class="abs head label">
    <div class="l"><img src="assets/wheel-pink.png" alt="">Projeto Pizza Solidária</div>
    <div class="r">Rotaract · Varginha</div>
  </div>

  <div class="abs h1"><span>Pizza</span><span class="sub">pré-assada<i>.</i></span></div>
  <div class="abs kick"><b>Leve pra casa, asse e sirva.</b> Cada pizza vendida vira ação social do Rotaract.</div>

  <div class="abs wheel"><svg id="wheel" viewBox="-470 -470 940 940"></svg></div>

  <div class="abs price">
    <div class="label lbl">Por apenas</div>
    <div class="row"><span class="cur">R$</span><span class="num">45</span><span class="cents">,00</span></div>
    <div class="unit">a unidade</div>
  </div>

  <div class="abs chip"><img src="assets/wheel-wine.png" alt=""><span>Cada fatia faz a roda girar.</span></div>

  <div class="abs rule"></div>
  <div class="abs foot">
    <img class="logo" src="assets/logo-white.png" alt="Rotaract Club de Varginha">
    <div class="c"><div class="label">Encomende pelo WhatsApp</div><div class="t">(35) 00000-0000</div></div>
  </div>

  <svg class="abs grain" viewBox="0 0 1080 1350" preserveAspectRatio="none">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>
</div>
<script>
let s=29;const r=()=>(s=(s*16807)%2147483647)/2147483647;
const W='#A30E2B',B='#0E0204',T='#774972',O='#7C5D72';
function gear(teeth,ro,ri){let d='';const st=Math.PI*2/teeth;
  for(let i=0;i<teeth;i++){const a=i*st;
    [[a-st*.5,ri],[a-st*.27,ri],[a-st*.19,ro],[a+st*.19,ro],[a+st*.27,ri],[a+st*.5,ri]].forEach(([g,R],j)=>d+=(i||j?'L':'M')+(Math.cos(g)*R).toFixed(1)+' '+(Math.sin(g)*R).toFixed(1));}
  return d+'Z';}
const RO=462, RI=418, RING=392, PZ=372, HUB=78;
const at=(a,d)=>[Math.cos(a)*d,Math.sin(a)*d];
let g=`<defs>
  <clipPath id="pz"><circle r="${PZ}"/></clipPath>
  <radialGradient id="ch" r="60%"><stop offset="0" stop-color="#F6E6EC"/><stop offset="1" stop-color="#E9CBD7"/></radialGradient>
  <radialGradient id="sh" r="50%"><stop offset=".8" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="wob" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence baseFrequency=".015" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="16"/></filter>
</defs>
<g transform="rotate(-8)">
<circle r="${RO+30}" fill="url(#sh)"/>
<path d="${gear(24,RO,RI)}" fill="${W}"/>
<circle r="${RING}" fill="${B}"/>
<g clip-path="url(#pz)">
  <circle r="${PZ}" fill="${O}"/>
  <g filter="url(#wob)"><circle r="${PZ-6}" fill="#C79AAE"/></g>
  <g filter="url(#wob)"><circle r="${PZ-44}" fill="url(#ch)"/></g>`;
for(let i=0;i<60;i++){const [x,y]=at(r()*6.283,PZ-12-r()*24);g+=`<circle cx="${x}" cy="${y}" r="${2+r()*5}" fill="${O}" opacity=".55"/>`}
for(let i=0;i<22;i++){const [x,y]=at(r()*6.283,HUB+30+r()*(PZ-HUB-100));g+=`<ellipse cx="${x}" cy="${y}" rx="${6+r()*14}" ry="${4+r()*7}" fill="${W}" opacity=".35" transform="rotate(${r()*180} ${x} ${y})"/>`}
// pepperoni placed inside each slice (slices centred on 0°,60°…; cuts at 30°+k·60°)
const pep=[];
for(let k=0;k<6;k++){const c=k*Math.PI/3;
  [[150,0],[245,-.28],[245,.28],[318,-.36],[318,0],[318,.36]].forEach(([d,da])=>{if(r()<.88)pep.push([...at(c+da+(r()-.5)*.06,d+(r()-.5)*14),28+r()*7])});}
pep.forEach(([x,y,R])=>{g+=`<circle cx="${x}" cy="${y}" r="${R}" fill="${W}"/><circle cx="${x}" cy="${y}" r="${R-6}" fill="none" stroke="#C02145" stroke-width="2"/>`;
  for(let k=0;k<5;k++){const [dx,dy]=at(r()*6.283,r()*R*.6);g+=`<circle cx="${x+dx}" cy="${y+dy}" r="${1.5+r()*2.5}" fill="#6B0819"/>`}
  g+=`<ellipse cx="${x-R*.35}" cy="${y-R*.4}" rx="${R*.32}" ry="${R*.12}" fill="#fff" opacity=".22" transform="rotate(-35 ${x} ${y})"/>`});
for(let k=0;k<6;k++){const c=k*Math.PI/3;[[200,.42],[285,-.12]].forEach(([d,da])=>{const [x,y]=at(c+da,d);g+=`<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="${T}" stroke-width="7"/>`})}
const leaf=(x,y,rot,k)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${k})"><path d="M0 0C14-17 42-17 56 0 42 17 14 17 0 0Z" fill="${T}"/><path d="M4 0H52" stroke="${O}" stroke-width="2"/></g>`;
for(let k=0;k<6;k++){const [x,y]=at(k*Math.PI/3-.18,195);g+=leaf(x,y,r()*360,.9)}
for(let i=0;i<220;i++){const [x,y]=at(r()*6.283,Math.sqrt(r())*(PZ-50));g+=`<rect x="${x}" y="${y}" width="${1.5+r()*2}" height="${1.5+r()*2}" fill="${O}" opacity=".8"/>`}
g+=`</g>`;
for(let k=0;k<6;k++){g+=`<rect x="${HUB-10}" y="-11" width="${RING-HUB+10}" height="22" fill="${W}" transform="rotate(${k*60+30})"/>`}
g+=`<circle r="${RING-1}" fill="none" stroke="${W}" stroke-width="6"/>
<circle r="${HUB}" fill="${W}"/><circle r="${HUB-30}" fill="${B}"/><rect x="-9" y="${-(HUB-6)}" width="18" height="34" fill="${B}" transform="rotate(30)"/>
</g>`;
document.getElementById('wheel').innerHTML=g;
</script>
</body>
</html>
